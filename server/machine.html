<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartMed machine</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1f1d;color:#e6fffb;text-align:center;margin:0;padding:20px}
.card{background:#12332f;border-radius:16px;padding:18px;max-width:460px;margin:0 auto 14px}
#qr svg{width:260px;height:260px;border-radius:12px}
.s{font-size:22px;font-weight:700;color:#5eead4}
code{word-break:break-all;font-size:12px;color:#9be}
button{padding:10px 16px;border-radius:10px;border:0;font-size:15px}
pre{text-align:left;font-size:12px;white-space:pre-wrap;color:#9bd}
</style></head><body>
<div class="card"><h2 id="title">SmartMed machine</h2><div id="state" class="s">BOOTING</div><div id="note"></div></div>
<div class="card"><div id="qr"></div><p>Scan with the SmartMed app<br><small>QR is single-use and refreshes about every 50 s</small></p><code id="code"></code></div>
<div class="card"><button id="jam">Simulate jam on next dispense: OFF</button><pre id="log"></pre></div>
<script>
// This page plays the role of the ESP32 firmware: it only talks to /api/machine, exactly like the real hardware will.
const id = location.pathname.split('/').pop();
const key = new URLSearchParams(location.search).get('key') || '';
let jamNext = false, busy = false, lastQr = 0;
const $ = (x) => document.getElementById(x);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const log = (m) => { $('log').textContent = new Date().toLocaleTimeString() + '  ' + m + '\n' + $('log').textContent.split('\n').slice(0, 10).join('\n'); };
const setState = (s, n = '') => { $('state').textContent = s; $('note').textContent = n; };
$('title').textContent = 'SmartMed machine ' + id;

async function call(body) {
  const r = await fetch('/api/machine', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-machine-key': key }, body: JSON.stringify({ machine_id: id, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}
async function refreshQr() {
  try {
    const d = await call({ action: 'session' });
    $('qr').innerHTML = d.svg; $('code').textContent = d.qr; lastQr = Date.now();
    if (!busy) setState('IDLE');
  } catch (e) { setState('OFFLINE', e.message); }
}
async function dispense(cmd) {
  busy = true;
  setState('VALIDATING'); log('Order ' + cmd.order_id + ' received'); await sleep(600);
  setState('DISPENSE_AUTHORIZED'); await sleep(500);
  try {
    for (const it of cmd.items) for (let k = 1; k <= it.qty; k++) {
      setState('MOTOR_RUN', 'lane ' + it.lane_no + ' (pack ' + k + '/' + it.qty + ')'); await sleep(1500);
      if (jamNext) { setState('DISPENSE_FAILED', 'limit switch timeout (jam)'); throw new Error('jam: limit switch timeout'); }
      setState('LIMIT_HIT'); await sleep(500);
      setState('WAITING_FOR_SENSOR'); await sleep(700);
    }
    setState('DISPENSE_CONFIRMED', 'IR sensor saw the packet drop');
    await call({ action: 'report', order_id: cmd.order_id, result: 'success' }); log('Dispensed OK');
  } catch (e) {
    await call({ action: 'report', order_id: cmd.order_id, result: 'fail', reason: e.message }).catch(() => {});
    log('FAILED: ' + e.message + ' (server refunds automatically)'); jamNext = false; $('jam').textContent = 'Simulate jam on next dispense: OFF';
  }
  await sleep(2500); busy = false; await refreshQr(); // QR tokens are single-use
}
$('jam').onclick = () => { jamNext = !jamNext; $('jam').textContent = 'Simulate jam on next dispense: ' + (jamNext ? 'ON' : 'OFF'); };
setInterval(async () => { if (busy) return; try { const d = await call({ action: 'poll' }); if (d.command) await dispense(d.command); } catch (e) { setState('OFFLINE', e.message); } }, 1000);
setInterval(() => call({ action: 'heartbeat' }).catch(() => {}), 15000);
setInterval(() => { if (!busy && Date.now() - lastQr > 50000) refreshQr(); }, 2000);
refreshQr();
</script></body></html>
